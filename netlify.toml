[build]
  publish = "dist"
  command = "npm run build"

[[redirects]]
  from = "/api/*"
  to = "https://memesao.agataodoriafrancisco91.workers.dev/api/:splat"
  status = 200

[[redirects]]
  from = "/r2/*"
  to = "https://memesao.agataodoriafrancisco91.workers.dev/r2/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22" 